services:
  # Primary Web Service (Native Node.js runtime)
  - type: web
    name: campus-desk-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://student-management-system-cc.vercel.app,https://student-management-system-q6or.vercel.app,http://localhost:5173

  # Additional Container Service (Isolated Docker Container)
  - type: web
    name: campus-desk-api-container
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://student-management-system-cc.vercel.app,https://student-management-system-q6or.vercel.app,http://localhost:5173
